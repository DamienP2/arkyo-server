name: Release

# Builds the release files: Arkyo for macOS (.dmg and .pkg), Windows (.msi)
# and Ubuntu (server .tar.gz), and the update packages installed servers
# download (Arkyo-<version>-<platform>: the server alone).
# Push a tag `v*` to publish a GitHub release, or run manually for artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        shell: bash
        run: packaging/stamp-version.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  # The Ubuntu server package and the Windows installer (macOS: below).
  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc of Ubuntu 22.04: the binary runs on 22.04 and later.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64, pkg: linux, name: ubuntu-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64, pkg: windows, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        shell: bash
        run: packaging/stamp-version.sh
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # A tag's cache serves no other run (caches are scoped to their ref): restore only.
          save-if: false
      - name: Build
        # The tray app ships with the Windows installer (macOS builds it in macos-installer).
        run: cargo build --release --locked -p arkyo-server ${{ matrix.pkg == 'windows' && '-p arkyo-tray' || '' }} --target ${{ matrix.target }}
      - name: Version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          SUFFIX=$VERSION; [ "$GITHUB_REF_TYPE" = tag ] || SUFFIX=dev-${GITHUB_SHA::7}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SUFFIX=$SUFFIX" >> "$GITHUB_ENV"
      - name: Ubuntu server package
        if: matrix.pkg == 'linux'
        shell: bash
        run: |
          NAME=Arkyo-$SUFFIX-${{ matrix.name }}
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/arkyo-server" "dist/$NAME/"
          find packaging/linux -maxdepth 1 -type f -exec cp {} "dist/$NAME/" \;
          if [ -f docs/INSTALL.md ]; then cp docs/INSTALL.md "dist/$NAME/"; fi
          ls -la "dist/$NAME"
          (cd dist && tar czf "$NAME.tar.gz" "$NAME")
      # Update package: the server alone, what installed servers download
      # to update themselves (named as every version looks for it).
      - name: Update package
        shell: bash
        run: |
          NAME=Arkyo-$SUFFIX-${{ matrix.platform }}
          mkdir -p "dist/update/$NAME"
          EXT=""; [ "${{ matrix.pkg }}" = windows ] && EXT=.exe
          cp "target/${{ matrix.target }}/release/arkyo-server$EXT" "dist/update/$NAME/"
          cd dist/update
          if [ "${{ matrix.pkg }}" = windows ]; then
            7z a "../$NAME.zip" "$NAME" >/dev/null
          else
            tar czf "../$NAME.tar.gz" "$NAME"
          fi
      - name: Windows installer (MSI)
        if: matrix.pkg == 'windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          export PATH="$PATH:$HOME/.dotnet/tools"
          wix extension add --global WixToolset.Util.wixext/5.0.2 WixToolset.Firewall.wixext/5.0.2
          DOC=(); [ -f docs/INSTALL.md ] && DOC=(-d InstallDoc=docs/INSTALL.md)
          wix build packaging/windows/msi/arkyo.wxs -arch x64 \
            -ext WixToolset.Util.wixext -ext WixToolset.Firewall.wixext \
            -d Version="$VERSION" -d BinDir="target/${{ matrix.target }}/release" -d DocsDir=. "${DOC[@]}" \
            -o "dist/Arkyo-$SUFFIX-${{ matrix.name }}.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: arkyo-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi

  macos-installer:
    needs: web
    runs-on: macos-latest
    env:
      # Secrets cannot be tested in `if:` directly.
      HAS_SIGNING: ${{ secrets.MACOS_CERTS_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        shell: bash
        run: packaging/stamp-version.sh
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal
          # A tag's cache serves no other run (caches are scoped to their ref): restore only.
          save-if: false
      - name: Build universal binary
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p arkyo-server -p arkyo-tray --target $t
          done
          mkdir -p dist
          for b in arkyo-server arkyo-tray; do
            lipo -create -output dist/$b target/aarch64-apple-darwin/release/$b target/x86_64-apple-darwin/release/$b
            lipo -info dist/$b
          done
      # Signing / notarization run only when the Apple secrets are configured.
      - name: Import signing certificates
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
          MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
        run: |
          echo "$MACOS_CERTS_P12" | base64 --decode > certs.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import certs.p12 -k build.keychain -P "$MACOS_CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm certs.p12
      - name: Build installer package
        env:
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          SUFFIX=$VERSION; [ "$GITHUB_REF_TYPE" = tag ] || SUFFIX=dev-${GITHUB_SHA::7}
          packaging/macos/pkg/build.sh dist/arkyo-server dist/arkyo-tray "$VERSION" "dist/Arkyo-$SUFFIX-macos-universal.pkg"
          pkgutil --payload-files dist/*.pkg | grep -E "Applications|arkyo-server$"
          pkgutil --payload-files dist/*.pkg | grep -q "usr/local/arkyo/arkyo-server$" || { echo "::error::the macOS package has no server"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SUFFIX=$SUFFIX" >> "$GITHUB_ENV"
      - name: Notarize
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/*.pkg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/*.pkg
      # Disk image: keeps the custom icons on the download (after notarization).
      - name: Disk image
        run: packaging/macos/pkg/make-dmg.sh dist/Arkyo-$SUFFIX-macos-universal.pkg "$VERSION" "dist/Arkyo-$SUFFIX-macos-universal.dmg"
      # Update packages (the server alone, per processor), as above.
      - name: Update packages
        run: |
          for a in arm64:aarch64-apple-darwin x86_64:x86_64-apple-darwin; do
            NAME=Arkyo-$SUFFIX-macos-${a%%:*}
            mkdir -p "dist/update/$NAME"
            cp "target/${a#*:}/release/arkyo-server" "dist/update/$NAME/"
            (cd dist/update && tar czf "../$NAME.tar.gz" "$NAME")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: arkyo-macos-installer
          path: |
            dist/*.dmg
            dist/*.pkg
            dist/*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: arkyo-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

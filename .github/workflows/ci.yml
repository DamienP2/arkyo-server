name: CI

on:
  # Branches only: a release tag runs the Release workflow (and its own checks).
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      # Embedded by crates/arkyo-server/build.rs in the engine jobs below.
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  engine:
    # The server embeds the built front: tests/http_web.rs runs against it.
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # windows-latest compiles the Windows-only code (service, tray).
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

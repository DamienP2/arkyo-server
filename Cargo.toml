[workspace]
resolver = "2"
members = ["crates/arkyo-core", "crates/arkyo-server", "crates/arkyo-tray"]
exclude = ["tools/make-icons"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
cuid = "1"
jiff = "0.2"
arkyo-core = { path = "crates/arkyo-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

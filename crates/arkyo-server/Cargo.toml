[package]
name = "arkyo-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "arkyo_server"
path = "src/lib.rs"

[[bin]]
name = "arkyo-server"
path = "src/main.rs"

[dependencies]
arkyo-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
sqlx.workspace = true
cuid.workspace = true
jiff.workspace = true
argon2 = "0.5"
rpassword = "7"
sha2 = "0.10"
base64 = "0.22"
rust-embed = { version = "8", features = ["mime-guess", "include-exclude"] }
mime_guess = "2"
flate2 = "1"
percent-encoding = "2"
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[build-dependencies]
flate2 = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
